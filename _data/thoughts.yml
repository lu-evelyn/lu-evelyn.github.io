- date: "2026-01-08"
  zh: |
    AI 可以帮助我们学会我们想学的任何东西，前提是改变传统的学习方式。

    传统学习路线，是自下而上的。先学 A，再学 B，最后学 C，然后你才能解决真正的问题。

    AI时代的学习路径，应该是自上而下的。发现了问题D，要用到ABC的其中一部分，就用AI去学；ABC 不需要全部学会，用多少就学多少，剩下的以后遇到问题再学。

    这种以终为始的学习方式，从问题出发，以解决问题为导向，让AI作为你的老师、同学、伙伴帮助你学习，会把学习效率提高上万倍。

    推荐 3 个 AI 工具：NotebookLM, chatgpt, notion。

    NotebookLM：只做“事实层”。把 PDF、行业报告、论文、深度文章扔进去，让他帮你整理：确定性结论、不确定性 / 争议、隐含假设、风险与边界，把事实搞清楚。

    ChatGPT：把事实“变成判断”。把 NotebookLM 的输出复制进 ChatGPT，让他帮你生成抽象出来的逻辑、判断。

    Notion：把“判断”变成长期资产，生成数据库。把 chatgpt生成的判断存下来，notionAI 可以帮你自动生成 memo，这会帮你构建一份可回溯、可复盘的个人数据资产。
  en: |
    AI can help us learn anything we want to learn, provided we change the traditional way of learning.

    The traditional path is bottom-up. You learn A first, then B, and finally C, and only then can you solve a real problem.

    The learning path in the AI era should be top-down. When you discover problem D and need part of A, B, or C, you use AI to learn it. You don't need to master all of A, B, and C; learn as much as you need, and learn the rest later, when a problem calls for it.

    This way of beginning with the end in mind starts from the problem and is oriented toward solving it. Letting AI be your teacher, classmate, and partner in learning can raise learning efficiency by orders of magnitude.

    Three AI tools I recommend: NotebookLM, chatgpt, and notion.

    NotebookLM: it only does the "fact layer." Throw in PDFs, industry reports, papers, and in-depth articles, and let it help you sort out settled conclusions, uncertainties / disputes, implicit assumptions, and risks and boundaries, so the facts are clear.

    ChatGPT: it turns facts "into judgments." Copy NotebookLM's output into ChatGPT and let it help you generate abstracted logic and judgments.

    Notion: it turns "judgments" into a long-term asset and builds a database. Store the judgments ChatGPT generates; Notion AI can help you auto-generate memos. This helps you build a personal data asset you can trace and review.

- date: "2026-01-10"
  zh: |
    在42章经对谈Monica创始人肖宏的播客里，有这样一段对话，给我很深的触动。

    曲凯老师说，“你们做的是一个插件，会不会担心其他插件的竞争？”

    肖宏说，“我不是从竞争的角度来看待自己的产品的。贝索斯曾经说过一段话我很认同，我们是通过观察竞争对手在做什么，来思考我们能为客户更多地做什么，这是我们看待竞争对手的方式。如果发现自己不能够为客户提供更多的服务，不能够满足客户更多的需求，那这个产品本身就应该消亡，这就是自然规律。”

    我觉得这是一种很强大的心态，是一种不会陷入FOMO的、不会陷入对比内耗中的心态，是一种更积极、更主动地面对竞争的心态。

    未来的时代是一个巨变的时代，AI 改变了生产力，让很多事情的门槛大幅降低。从某种意义上讲，是一个竞争更激烈、更高维的时代。就像肖宏说的，发现真实的需求，去解决问题，做你自己，才是稳定的生存心态。
  en: |
    In the 42Chapter interview podcast with Monica founder Xiao Hong, there was an exchange that moved me deeply.

    Teacher Qu Kai asked, "You're building a plugin. Do you worry about competition from other plugins?"

    Xiao Hong said, "I don't look at our product from the angle of competition. Bezos once said something I strongly agree with: we look at what competitors are doing in order to think about what more we can do for customers. That is how we look at competitors. If we find that we can no longer provide more service to customers, or meet more of their needs, then the product itself should disappear. That is a law of nature."

    I think this is a very strong mindset: one that does not fall into FOMO, does not get consumed by comparison, and faces competition in a more active and constructive way.

    The era ahead is one of enormous change. AI has changed productivity and lowered the barrier to many things. In a sense, it is a more intense, higher-dimensional era of competition. As Xiao Hong said, finding real needs, solving problems, and being yourself is the stable mindset for staying in the game.

- date: "2026-01-12"
  zh: |
    《明朝那些事儿》：这个世界上凡是存在的东西，都具有合理性，否则它就不会诞生。
