- date: "2026-11-24"
  zh: |
    It's all in a game, just play the role。

    整个社会就是一个大型游戏，所有人都在这个 game 里面。社会会赋予我们一个位置，很多时候我们会不知不觉身处其中。

    很多痛苦往往来自于人的想法和位置之间的差异。

    而实际上我们能做的只是在这个位置上把这个事做好。
  en: |
    It's all in a game, just play the role.

    Society as a whole is one big game, and everyone is in it. Society gives us a place, and often we find ourselves in it without even realizing it.

    A lot of suffering comes from the gap between what people have in mind and the position they find themselves in.

    In practice, all we can do is do the job well in the position we're in.

- date: "2026-11-24"
  zh: |
    其实真正重要的并不是所谓认知、知识，而是熟练。

    我们常常会去想我们要成为怎么样的人，做成什么样的事儿。这种想象和期许反过来又常常困扰我们。

    其实我们真正应该做的就是「做事情」本身。把你想做的的事儿、能做的事儿做了，做着做着就熟练了，就懂了，就成为了。
  en: |
    What really matters is proficiency built through practice, more than what we call cognition or knowledge.

    We often think about the kind of person we want to become and what we want to accomplish. Those imaginings and expectations often end up troubling us.

    What we really need to do is get on with doing things. Do the things you want to do and can do. As you keep doing them, you get better, you understand, and you become the person you had in mind.

- date: "2026-11-24"
  zh: |
    声音这种媒介是比文字要包含更多信息的。

    如果你看文字稿其实有很多东西都会被隐藏掉；但是你听音频，其中的语气、停顿、气口，一些随意的吐槽，都包含了很多有效的信息。
  en: |
    Audio carries more information than text.

    A transcript hides a lot of things. When you listen, the tone, the pauses, the moments when someone takes a breath, and the offhand complaints all tell you quite a bit.

- date: "2026-11-24"
  zh: |
    看柴静谈陈虻，讲到陈虻曾经跟她说：

    真正好的内容是靠结构驱动的，靠大量的事实和结构把它穿起来，不需要什么观点。

    你这篇内容交上去应该让审稿人一句都动不了，一句都改不了，这才是真正有力量的内容；而不是特别感性的去发挥，想要去说一两句至理名言或者特别煽情的话，如果删掉这一句，就什么也没有了。

    很受震动。

    同时也感动于他们之间的真挚情感。我觉得这是莫大的幸运吧，一生当中能遇到这样的一位老师、领路人，是一个坐标、灯塔一样的存在，赋予彼此如此深刻的感情。
  en: |
    I watched Chai Jing talk about Chen Meng. She recalled something he once told her:

    Truly good work is driven by structure. You take a great many facts and use the structure to string them together. You don't need to make a point.

    When you hand in a piece, the editor should find that there isn't a single sentence they can move or change. That's what gives a piece real power. If you go off on an emotional riff and try to come up with a line or two of profound wisdom or something especially moving, take that line away and there's nothing left.

    It shook me.

    I was also moved by the sincerity of their feelings for each other. I think it's an enormous stroke of luck to meet a teacher and guide like that in your lifetime, someone who serves as a point of reference, like a lighthouse, and to come to care so deeply for each other.

