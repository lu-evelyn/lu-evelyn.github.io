- date: "2025-12-31"
  zh: |
    宝哥星球里的一篇文章给我带来很大冲击。他说，

    Business insider在10月份报道过一个数字，ChatGPT每天处理25亿条信息，按照当时7亿周活算，这组数据对应每个周活一周也就是25条，每天3-4条。所以重度用户每年2万条 message sent是全球1%，每年5千条也是全球1%。大多数订阅用户是没有高密度的知识工作处理量的。

    所以现状就是，会用的人把AI当外挂，生产力直接拉开；但不会用的人因为习惯和工作流差距，还只是路人。这就是为什么Sam说，即便是模型只停留在现在的能力，被真正利用到的能力和任务还远落后于模型能力，这里有一个巨大的落地 GAP。
  en: |
    An article in Baoge's community hit me hard. He said:

    Business Insider reported a figure in October: ChatGPT processes 2.5 billion messages a day. Against 700 million weekly active users at the time, that works out to about 25 messages per weekly active user per week, or 3–4 a day. So heavy users who send 20,000 messages a year are the top 1% globally, and even 5,000 a year is also the global top 1%. Most subscribers do not have a high-density volume of knowledge work.

    So the current situation is this: people who know how to use AI treat it as a cheat code and pull far ahead in productivity; people who don't, because of habits and workflow gaps, are still just bystanders. That's why Sam says that even if the model stayed at today's capabilities, the abilities and tasks actually being put to use would still lag far behind what the model can do. There is a huge gap in getting it to land.

- date: "2026-01-02"
  zh: |
    超级牛股需要扩张来拉动，扩张是好事 → 扩张有时候快过 EBITDA 增速，几个季度内的 ROIC 可能要下降 → 股价会被惩罚 → 投资带来的效果开始出现 → 下跌后的股价动量和 FCF 估值都支持未来更高的超额回报 → 重启上升通道又是一波猛涨 → 得到回报后公司信心满满，可能又要开启下一轮扩张，再次循环 学会利用这种循环范式的节奏，对我们在美国投资成长股是很有意义的。只要飞轮和长期逻辑没有破坏，因为这种节奏跌下来就不用太慌，反而是机会，要明白这是在几百只十倍股上都出现过的普遍规律。
    from 宝哥
  en: |
    Super compounders need expansion to drive growth, and expansion is a good thing → expansion sometimes outruns EBITDA growth, and ROIC may decline for a few quarters → the stock gets punished → the effects of the investment start to show up → after the decline, both price momentum and FCF valuation support higher excess returns ahead → the uptrend restarts, and another sharp rise follows → after being rewarded, the company is full of confidence and may start another round of expansion, and the cycle repeats. Learning to use the rhythm of this cyclical pattern is very meaningful for us when investing in U.S. growth stocks. As long as the flywheel and the long-term logic are not broken, a drop that comes from this rhythm is not something to panic about; it is an opportunity. This is a common pattern that has shown up in hundreds of ten-baggers.
    from 宝哥

