    感受，感性的东西可能才是更重要的，而不是我们过去一直强调的理性脑。

    直觉，感受，故事，这些是很珍贵的东西。

    在 AI时代，更是如此。
  en: |
    Feelings, and the things we take in through feeling, may matter more than the rational mind we've always emphasized.

    Intuition, feelings, stories. These are precious things.

    Even more so in the age of AI.
