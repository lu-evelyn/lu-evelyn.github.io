# 每项包含 country（footprints-atlas.json 里的国家或地区 id）、lon、lat，
# 以及 zh: {city, note}、en: {city, note}。没有感受时 note 留空。
# 只有地区名时，坐标为地区级标记。
- country: SGP
  lon: 103.8539
  lat: 1.295
  zh:
    city: 新加坡
    note: |-
      南洋理工和新加坡国立都很漂亮，铺满青草的坡地波浪起伏，校园像生长在山间一样。

      城市的街道很干净整洁，散步的时候看到一中鸡妈妈带着一排小鸡过马路，太有趣了！

      但，是美食荒漠......so sad
  en: { city: Singapore, note: "" }
